<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Video Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="video-card">
      <!-- Thumbnail Section -->
      <div class="thumbnail">
        <img
          id="thumbnailImage"
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/A_black_image.jpg/640px-A_black_image.jpg"
          alt="Video Thumbnail"
        />
        <span class="duration" contenteditable="true">12:34</span>
      </div>
      <!-- Video Information Section -->
      <div class="video-info">
        <img
          class="avatar"
          id="avatarImage"
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/A_black_image.jpg/640px-A_black_image.jpg"
        />
        <h3 class="title" contenteditable="true">Sample Video Title</h3>
        <p class="channel" contenteditable="true">Channel Name</p>
        <p class="meta" contenteditable="true">1M views • 1 week ago</p>
      </div>
    </div>
    <h3>Thumbnail:</h3>
    <input type="file" id="thumbnailInput" accept="image/*" />
    <h3>PFP:</h3>
    <input type="file" id="avatarInput" accept="image/*" />
    <script src="script.js"></script>
  </body>
</html>
