<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Video Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="video-card">
    <!-- Thumbnail Section -->
    <div class="thumbnail">
      <!-- Replace the src attribute with your thumbnail image URL -->
      <img id="thumbnailImage" src="https://i.ytimg.com/vi/jFWVqxZe59A/hq720.jpg?sqp=-oaymwEcCNAFEJQDSFXyq4qpAw4IARUAAIhCGAFwAcABBg==&rs=AOn4CLAsbgFUNabEEyE3VnyZ1AFm9zZjcw" alt="Video Thumbnail">
      <span class="duration" contenteditable="true">12:34</span>
    </div>
    <!-- Video Information Section -->
    <div class="video-info">
      <img class="avatar" id="avatarImage" src="https://yt3.ggpht.com/IlPYXaXQf8bdEBelQyNB6EHPRjmlACUI_Q8E8024bY_t46-CDtdp-92q3rQtogrDyYd7TQ-2ug=s68-c-k-c0x00ffffff-no-rj">
      <h3 class="title" contenteditable="true">Sample Video Title</h3>
      <p class="channel" contenteditable="true">Channel Name</p>
      <p class="meta" contenteditable="true">1M views • 1 week ago</p>
    </div>
  </div>
  Thumbnail:
  <input type="file" id="thumbnailInput" accept="image/*">
  PFP:
  <input type="file" id="avatarInput" accept="image/*">
  <script src="script.js"></script>
</body>
</html>
